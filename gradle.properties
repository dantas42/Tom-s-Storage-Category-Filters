# Sets default memory used for gradle commands.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
net.neoforged.gradle.caching.enabled=true

## Environment Properties

# Minecraft 1.21.1 is the NeoForge "1.21" line (NeoForge 21.1.x).
minecraft_version=1.21
minecraft_version_range=[1.21.1,1.21.2)
# Same major line as the Ekzmem Neoforge instance. Apotheosis 8.9.0 requires 21.1.235+.
neo_version=21.1.252
neo_version_range=[21.1.235,)
loader_version_range=[1,)
mapping_channel=official
mapping_version=1.21.1

## Mod Properties

mod_id=toms_storage_category_filters
mod_name=Tom's Storage Category Filters
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.tiago.tomsstoragecategories
mod_authors=dantas42
mod_description=Adds category filter buttons to the Tom's Simple Storage terminal (client side).

