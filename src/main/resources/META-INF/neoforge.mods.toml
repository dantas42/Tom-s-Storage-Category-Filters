modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

# Mixin configuration, registered the same way Apotheosis 8.9.0 does it.
[[mixins]]
config = "toms_storage_category_filters.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
# Client-only addon: the server does not need it and must not require it.
displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "toms_storage"
type = "required"
versionRange = "[2.4.2,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "apotheosis"
type = "optional"
versionRange = "[8.9.0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "apothic_enchanting"
type = "optional"
versionRange = "[1.6.2,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "curios"
type = "optional"
versionRange = "[9.5.1,)"
ordering = "AFTER"
side = "CLIENT"
